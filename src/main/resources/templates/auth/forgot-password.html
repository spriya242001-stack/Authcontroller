<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartSpend - Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
    <h2 class="text-center mb-3 text-primary fw-bold">Reset Password</h2>
    <p class="text-center text-muted small mb-4">Enter your registered email address and we'll send you a link to reset your password.</p>

    <!-- Success or Error Messages -->
    <div th:if="${error}" class="alert alert-danger text-center py-2" th:text="${error}"></div>
    <div th:if="${message}" class="alert alert-success text-center py-2" th:text="${message}"></div>

    <form th:action="@{/forgot-password}" method="post">
        <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" required autofocus>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2">Send Reset Link</button>
    </form>

    <div class="mt-3 text-center">
        <p class="small">Remembered your password? <a href="/login" class="text-decoration-none">Login here</a></p>
    </div>
</div>

</body>
</html>
