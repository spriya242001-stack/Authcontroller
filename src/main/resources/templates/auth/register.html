<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartSpend - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-sm p-4" style="width: 100%; max-width: 450px;">
    <h2 class="text-center mb-3 text-primary fw-bold">Create Account</h2>
    <p class="text-center text-muted small mb-4">Join SmartSpend to track your expenses securely.</p>

    <!-- Success or Error Messages -->
    <div th:if="${error}" class="alert alert-danger text-center py-2" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success text-center py-2" th:text="${success}"></div>

    <form th:action="@{/register}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2">Register</button>
    </form>

    <div class="mt-3 text-center">
        <p class="small">Already have an account? <a href="/login" class="text-decoration-none">Login here</a></p>
    </div>
</div>

</body>
</html>
