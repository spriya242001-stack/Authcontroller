<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>SmartSpend - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<!-- Navbar Fragment -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container my-4">
  <h2 class="mb-4 text-primary fw-bold">Dashboard Overview</h2>

  <!-- Summary Stat Cards -->
  <div class="row g-4 mb-4">
    <div class="col-md-4">
      <div class="card shadow-sm border-0 bg-white">
        <div class="card-body">
          <h6 class="text-muted text-uppercase small fw-bold">Total Balance / Savings</h6>
          <h3 class="text-success fw-bold mb-0" th:text="${'$' + (totalIncome - totalExpense)}">$2,450.00</h3>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm border-0 bg-white">
        <div class="card-body">
          <h6 class="text-muted text-uppercase small fw-bold">Total Monthly Income</h6>
          <h3 class="text-primary fw-bold mb-0" th:text="${'$' + totalIncome}">$4,200.00</h3>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm border-0 bg-white">
        <div class="card-body">
          <h6 class="text-muted text-uppercase small fw-bold">Total Monthly Expenses</h6>
          <h3 class="text-danger fw-bold mb-0" th:text="${'$' + totalExpense}">$1,750.00</h3>
        </div>
      </div>
    </div>
  </div>

  <!-- Charts Section -->
  <div class="row g-4 mb-4">
    <!-- Expense Breakdown Chart -->
    <div class="col-lg-7">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h5 class="card-title mb-3">Expenses by Category</h5>
          <div style="position: relative; height: 300px;">
            <canvas id="expenseCategoryChart"></canvas>
          </div>
        </div>
      </div>
    </div>
    <!-- Monthly Trends Chart -->
    <div class="col-lg-5">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h5 class="card-title mb-3">Monthly Spending Trend</h5>
          <div style="position: relative; height: 300px;">
            <canvas id="monthlyTrendChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick Actions & Recent Transactions Summary -->
  <div class="row">
    <div class="col-12">
      <div class="card shadow-sm border-0">
        <div class="card-body d-flex justify-content-between align-items-center">
          <h5 class="card-title mb-0">Need to manage your records?</h5>
          <div>
            <a th:href="@{/expenses}" class="btn btn-primary me-2">Manage Expenses (CRUD)</a>
            <a th:href="@{/budgets}" class="btn btn-outline-primary">Check Budgets</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom Charts Script -->
<script th:src="@{/js/charts.js}"></script>
</body>
</html>
