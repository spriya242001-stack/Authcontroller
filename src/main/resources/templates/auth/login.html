<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartSpend - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

<div class="card shadow-sm p-4" style="width: 100%; max-width: 400px;">
    <h2 class="text-center mb-4 text-primary fw-bold">SmartSpend</h2>

    <!-- Error Message Handling -->
    <div th:if="${param.error}" class="alert alert-danger text-center py-2">
        Invalid username or password.
    </div>

    <!-- Logout Message Handling -->
    <div th:if="${param.logout}" class="alert alert-success text-center py-2">
        You have been logged out successfully.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">Email or Username</label>
            <input type="text" class="form-control" id="username" name="username" required autofocus>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2">Login</button>
    </form>

    <div class="mt-3 text-center">
        <a href="/forgot-password" class="text-decoration-none small">Forgot Password?</a>
        <p class="mt-2 small">Don't have an account? <a href="/register" class="text-decoration-none">Sign up</a></p>
    </div>
</div>

</body>
</html>
