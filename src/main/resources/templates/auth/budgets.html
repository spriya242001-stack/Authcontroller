<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>SmartSpend - Budgets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<!-- Navbar Fragment -->
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container my-4">
    <h2 class="mb-4 text-primary fw-bold">Category Budgets</h2>

    <!-- Notifications / Alerts -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert" th:text="${success}">
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert" th:text="${error}">
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Set Monthly Budget Form Card -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <h5 class="card-title mb-3">Set Monthly Budget per Category</h5>
            <form th:action="@{/budgets}" method="post">
                <div class="row g-3">
                    <div class="col-md-5">
                        <label for="category" class="form-label">Category</label>
                        <select class="form-select" id="category" name="category" required>
                            <option value="" disabled selected>Choose category...</option>
                            <option value="Food">Food & Dining</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                        </select>
                    </div>
                    <div class="col-md-5">
                        <label for="limitAmount" class="form-label">Monthly Limit ($)</label>
                        <input type="number" step="0.01" class="form-control" id="limitAmount" name="limitAmount" placeholder="0.00" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">Save Budget</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Budget Overview & Tracking Table -->
    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="card-title mb-3">Active Budgets & Limit Alerts</h5>
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Category</th>
                        <th>Budget Limit</th>
                        <th>Spent</th>
                        <th>Remaining</th>
                        <th>Progress</th>
                        <th>Status</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Dynamic iteration over user budgets -->
                    <tr th:each="budget : ${budgets}">
                        <td th:text="${budget.category}">Food</td>
                        <td th:text="${'$' + budget.limitAmount}">$500.00</td>
                        <td th:text="${'$' + budget.spentAmount}">$420.00</td>
                        <td th:text="${'$' + (budget.limitAmount - budget.spentAmount)}">$80.00</td>
                        <td style="width: 25%;">
                            <div class="progress" style="height: 8px;">
                                <div class="progress-bar" role="progressbar"
                                     th:style="'width: ' + ${budget.percentage} + '%'"
                                     th:classappend="${budget.percentage > 90} ? 'bg-danger' : (${budget.percentage > 75} ? 'bg-warning' : 'bg-success')"
                                     aria-valuenow="${budget.percentage}" aria-valuemin="0" aria-valuemax="100"></div>
                            </div>
                        </td>
                        <td>
                            <span class="badge"
                                  th:classappend="${budget.percentage > 90} ? 'bg-danger' : 'bg-success'"
                                  th:text="${budget.percentage > 90} ? 'Exceeding / Nearing Limit' : 'On Track'">On Track</span>
                        </td>
                    </tr>
                    <!-- Fallback state if no budgets exist -->
                    <tr th:if="${#lists.isEmpty(budgets)}">
                        <td colspan="6" class="text-center text-muted py-4">No category budgets created yet. Set one above!</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
