<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartSpend - Expenses Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

<!-- Navbar Fragment -->
<nav class="navbar navbar-expand navbar-dark bg-primary shadow-sm"><div class="container-fluid">
<a class="navbar-brand fw-bold" href="/dashboard">SmartSpend</a><div class="navbar-nav me-auto">
<a class="nav-link" href="/dashboard">Dashboard</a><a class="nav-link" href="/expenses">Expenses</a><a class="nav-link" href="/budgets">Budgets</a></div>
<button id="logout-button" class="btn btn-outline-light btn-sm" type="button">Logout</button></div></nav>

<div class="container my-4"><div id="page-message" class="alert" role="status" aria-live="polite" hidden></div>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary fw-bold">Manage Expenses</h2>
    <!-- Button to trigger Add Expense Modal -->
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#expenseModal" id="add-expense">
      + Add New Transaction
    </button>
  </div>

  <!-- Success / Error Alerts -->

  <!-- Filter and Search Section -->
  <div class="card shadow-sm mb-4">
    <div class="card-body">
      <form id="filter-form" action="/api/expenses/filter" method="get" class="row g-3">
        <div class="col-md-3">
          <label for="categoryFilter" class="form-label">Category</label>
          <select class="form-select" id="categoryFilter" name="category">
            <option value="">All Categories</option>
            <option value="Food">Food & Dining</option>
            <option value="Utilities">Utilities</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
          </select>
        </div>
        <div class="col-md-3">
          <label for="startDate" class="form-label">Start Date</label>
          <input type="date" class="form-control" id="startDate" name="startDate">
        </div>
        <div class="col-md-3">
          <label for="endDate" class="form-label">End Date</label>
          <input type="date" class="form-control" id="endDate" name="endDate">
        </div>
        <div class="col-md-3 d-flex align-items-end">
          <button type="submit" class="btn btn-outline-primary w-100 me-2">Filter</button>
          <a href="/expenses" class="btn btn-outline-secondary">Reset</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Full CRUD Table -->
  <div class="card shadow-sm">
    <div class="card-body">
      <div class="table-responsive">
        <table class="table align-middle table-hover">
          <thead class="table-light">
          <tr>
            <th>Date</th>
            <th>Title</th>
            <th>Category</th>
            <th>Type</th>
            <th>Amount</th>
            <th>Description</th>
            <th class="text-end">Actions</th>
          </tr>
          </thead>
          <tbody id="records"><tr><td colspan="7" class="text-center">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Expense Modal -->
<div class="modal fade" id="expenseModal" tabindex="-1" aria-labelledby="expenseModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="expense-form" action="/api/expenses" method="post">
        <div class="modal-header">
          <h5 class="modal-title" id="expenseModalLabel">Add Transaction</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" name="title" required>
          </div>
          <div class="mb-3">
            <label for="amount" class="form-label">Amount ($)</label>
            <input type="number" step="0.01" class="form-control" id="amount" name="amount" min="0.01" required>
          </div>
          <div class="mb-3">
            <label for="modalCategory" class="form-label">Category</label>
            <select class="form-select" id="modalCategory" name="category" required>
              <option value="Food">Food & Dining</option>
              <option value="Utilities">Utilities</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="type" class="form-label">Type</label>
            <select class="form-select" id="type" name="type" required>
              <option value="EXPENSE">Expense</option>
              <option value="INCOME">Income</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input type="date" class="form-control" id="date" name="date" required>
          </div>
          <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="2"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Transaction</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js" defer></script>
<script src="/js/expenses.js" defer></script>
</body>
</html>
