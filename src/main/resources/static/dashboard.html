<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartSpend - Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<!-- Navbar Fragment -->
<nav class="navbar navbar-expand navbar-dark bg-primary shadow-sm"><div class="container-fluid">
<a class="navbar-brand fw-bold" href="/dashboard">SmartSpend</a><div class="navbar-nav me-auto">
<a class="nav-link" href="/dashboard">Dashboard</a><a class="nav-link" href="/expenses">Expenses</a><a class="nav-link" href="/budgets">Budgets</a></div>
<button id="logout-button" class="btn btn-outline-light btn-sm" type="button">Logout</button></div></nav>

<div class="container my-4"><div id="page-message" class="alert" role="status" aria-live="polite" hidden></div>
  <h2 class="mb-4 text-primary fw-bold">Dashboard Overview</h2>

  <!-- Summary Stat Cards -->
  <div class="row g-4 mb-4">
    <div class="col-md-4">
      <div class="card shadow-sm border-0 bg-white">
        <div class="card-body">
          <h6 class="text-muted text-uppercase small fw-bold">Monthly Balance</h6>
          <h3 id="total-balance" class="text-success fw-bold mb-0">Loading…</h3>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm border-0 bg-white">
        <div class="card-body">
          <h6 class="text-muted text-uppercase small fw-bold">Total Monthly Income</h6>
          <h3 id="total-income" class="text-primary fw-bold mb-0">Loading…</h3>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm border-0 bg-white">
        <div class="card-body">
          <h6 class="text-muted text-uppercase small fw-bold">Total Monthly Expenses</h6>
          <h3 id="total-expense" class="text-danger fw-bold mb-0">Loading…</h3>
        </div>
      </div>
    </div>
  </div>

  <!-- Charts Section -->
  <div class="row g-4 mb-4">
    <!-- Expense Breakdown Chart -->
    <div class="col-lg-7">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h5 class="card-title mb-3">Expenses by Category</h5>
          <div style="position: relative; height: 300px;">
            <canvas id="expenseCategoryChart"></canvas>
          </div>
        </div>
      </div>
    </div>
    <!-- Monthly Trends Chart -->
    <div class="col-lg-5">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h5 class="card-title mb-3">Monthly Spending Trend</h5>
          <div style="position: relative; height: 300px;">
            <canvas id="monthlyTrendChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick Actions & Recent Transactions Summary -->
  <div class="row">
    <div class="col-12">
      <div class="card shadow-sm border-0">
        <div class="card-body d-flex justify-content-between align-items-center">
          <h5 class="card-title mb-0">Need to manage your records?</h5>
          <div>
            <a href="/expenses" class="btn btn-primary me-2">Manage Expenses (CRUD)</a>
            <a href="/budgets" class="btn btn-outline-primary">Check Budgets</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom Charts Script -->

<script src="/js/common.js" defer></script>
<script src="/js/dashboard.js" defer></script>
</body>
</html>
