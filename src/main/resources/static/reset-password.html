<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>SmartSpend - Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
<main class="card shadow-sm p-4" style="width:100%;max-width:400px">
  <h1 class="h3 text-primary">Choose a new password</h1>
  <div id="page-message" class="alert" role="status" aria-live="polite" hidden></div>
  <form id="reset-form">
    <label for="email" class="form-label">Account email</label>
    <input id="email" name="email" type="email" class="form-control mb-3" autocomplete="email" required>
    <label for="new-password" class="form-label">New password</label>
    <input id="new-password" name="newPassword" type="password" class="form-control mb-3" minlength="8" autocomplete="new-password" required>
    <button class="btn btn-primary w-100" type="submit">Reset password</button>
  </form>
  <a class="mt-3" href="/login">Back to login</a>
</main>
<script src="/js/common.js" defer></script>
<script src="/js/reset-password.js" defer></script>
</body>
</html>
